# Task 3 v3.0: preflight debug run — short epochs to validate warmup/ramp/predictor plumbing.
# Uses joint mode because no frozen probe checkpoint exists yet.
experiment_name: task3_v3_0_preflight_debug
split_json: "outputs/task3_split/split_info.json"
metadata_csv: "outputs/task1_topo_v3/patch_metadata.csv"
patch_image_dir: "outputs/task1_topo_v3/patches/images"
patch_mask_dir: "outputs/task1_topo_v3/patches/masks"
output_dir: "outputs/task3_v3_0_preflight_debug"
target_col: "sci_res2_norm"
group_col: "sample_id"
val_ratio: 0.2
random_state: 42
hard_ratio: 0.2
image_size: 128
batch_size: 16
lr: 0.001
weight_decay: 0.0001
warmup_epochs: 8
joint_epochs: 7
num_workers: 0
device: null

difficulty_weighting:
  enabled: true
  mode: joint
  tau: 0.6
  alpha: 0.5
  gamma: 2.0
  warmup_epochs: 3
  joint_calib_epochs: 4
  joint_oracle_weight_epochs: 0
  ramp_epochs: 3
  lambda_diff: 0.5
  pred_weight_detach: true
  min_weight: 1.0
  max_weight: 1.5
  normalize_weights_in_batch: true
  debug_save_first_weighted_batch: true

sampling:
  use_weighted_sampler: false

threshold_sweep:
  enabled: true
  thresholds: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]

logging:
  save_weight_stats: true
