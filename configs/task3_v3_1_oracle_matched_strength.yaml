# P6: Oracle quadratic with (tau, alpha, max_weight) grid-matched to frozen-probe-derived pooled weight stats on train.
# Note: GT-based oracle cannot exactly match probe-pred weight std (~0.012); this is best-effort (~0.026 std).
# See matched_oracle_calibration.json -> matched_strength_recommended_for_p6
experiment_name: task3_v3_1_oracle_matched_strength
split_json: "outputs/task3_split/split_info.json"
metadata_csv: "outputs/task1_topo_v3/patch_metadata.csv"
patch_image_dir: "outputs/task1_topo_v3/patches/images"
patch_mask_dir: "outputs/task1_topo_v3/patches/masks"
output_dir: "outputs/task3_v3_1_oracle_matched_strength_same_split"
target_col: "sci_res2_norm"
group_col: "sample_id"
val_ratio: 0.2
random_state: 42
hard_ratio: 0.2
image_size: 128
batch_size: 16
lr: 0.001
weight_decay: 0.0001
warmup_epochs: 30
joint_epochs: 50
num_workers: 0
device: null

difficulty_weighting:
  enabled: true
  mode: oracle
  weight_mode: oracle_quadratic
  tau: 0.96
  alpha: 0.2573
  gamma: 2.0
  fov_min: 0.80
  warmup_epochs: 5
  min_weight: 1.0
  max_weight: 1.2615
  normalize_weights_in_batch: true

sampling:
  use_weighted_sampler: false
  hard_sampling_weight: 2.0

threshold_sweep:
  enabled: true
  thresholds: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]

logging:
  save_weight_stats: true
