# J3: Joint training with predicted weighting, pred_weight_detach=false (end-to-end).
# Only run if J2 is stable. Same phases as J2 but gradients flow through difficulty head.
experiment_name: task3_J3_joint_detach_false
split_json: "outputs/task3_split/split_info.json"
metadata_csv: "outputs/task1_topo_v3/patch_metadata.csv"
patch_image_dir: "outputs/task1_topo_v3/patches/images"
patch_mask_dir: "outputs/task1_topo_v3/patches/masks"
output_dir: "outputs/task3_J3_joint_detach_false"
target_col: "sci_res2_norm"
group_col: "sample_id"
val_ratio: 0.2
random_state: 42
hard_ratio: 0.2
image_size: 128
batch_size: 16
lr: 0.001
weight_decay: 0.0001
warmup_epochs: 30
joint_epochs: 50
num_workers: 0
device: null

difficulty_weighting:
  enabled: true
  mode: joint
  tau: 0.6
  alpha: 0.5
  gamma: 2.0
  warmup_epochs: 5
  min_weight: 1.0
  max_weight: 1.5
  normalize_weights_in_batch: true
  joint_calib_epochs: 15
  joint_oracle_weight_epochs: 0
  lambda_diff: 0.5
  pred_weight_detach: false
  ramp_epochs: 10
  debug_save_first_weighted_batch: true

sampling:
  use_weighted_sampler: false

threshold_sweep:
  enabled: true
  thresholds: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]

logging:
  save_weight_stats: true
